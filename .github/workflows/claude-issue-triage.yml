name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    if: github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*)"'
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} del repositorio ${{ github.repository }}.

            Sigue estos pasos:
            1. Lee el issue con `gh issue view ${{ github.event.issue.number }} --json title,body,labels,comments`.
            2. Consulta los labels disponibles con `gh label list`. Usa ÚNICAMENTE labels de esa lista
               (bug, enhancement, documentation, question, good first issue, help wanted, duplicate,
               invalid, wontfix). Nunca crees labels nuevos.
            3. Asigna con `gh issue edit ${{ github.event.issue.number }} --add-label "..."` los labels
               que apliquen, sin duplicar los que ya tenga el issue.
            4. Revisa el código del repo (arquitectura descrita en CLAUDE.md: `game.js`, `index.html`,
               `style.css` — Tetris vanilla JS sin dependencias) para diagnosticar el problema o la
               solicitud del issue. Identifica funciones y archivos concretos relacionados
               (ej. `game.js:loop`, `tryRotate`, `collide`, etc.).
            5. Si el issue ya tiene un comentario de diagnóstico previo (identifícalo por el encabezado
               "## Diagnóstico"), actualízalo con `gh issue comment ${{ github.event.issue.number }} --edit-last`
               en vez de crear uno nuevo. Si no existe, publica uno nuevo con
               `gh issue comment ${{ github.event.issue.number }} --body "..."`.
            6. El comentario debe estar en español, ser conciso, y tener exactamente estas secciones:

               ## Diagnóstico

               **Resumen**: breve descripción del problema o solicitud.

               **Causa raíz / área afectada**: archivos y funciones concretos involucrados.

               **Enfoque de solución propuesto**: pasos de alto nivel para resolverlo (sin implementar
               código todavía).

               **Labels asignados**: lista de labels aplicados y por qué.

               El comentario debe estar escrito en formato Markdown válido y bien interpretable por
               GitHub (encabezados con `##`, negritas con `**texto**`, listas con `-`, bloques de código
               con backticks para nombres de archivos/funciones, etc.).

            No modifiques código ni abras pull requests — solo etiqueta y comenta el issue.
